<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>間取りエディタ - VR Homes</title>
<style>
:root{
  --ink:#0f172a; --ink-2:#334155; --ink-3:#64748b; --ink-4:#94a3b8;
  --line:#e2e8f0; --line-2:#cbd5e1; --bg:#f8fafc; --surface:#fff;
  --blue:#2563eb; --blue-d:#1d4ed8; --blue-l:#eff6ff; --blue-m:#dbeafe;
  --red:#dc2626; --red-l:#fef2f2; --green:#16a34a; --amber:#d97706;
  --wall:#1e293b; --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;font-size:13px;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}

/* ── ヘッダー ── */
.top{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.top h1{font-size:14px;margin:0 6px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.top h1 small{font-weight:500;color:var(--ink-3);margin-left:6px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:32px;padding:0 11px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:#f1f5f9}
.btn:disabled{opacity:.4;cursor:default;background:var(--surface)}
.btn.icon{width:32px;padding:0}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.btn.primary:hover{background:var(--blue-d)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#f1f5f9}
.btn.danger{color:var(--red)}
.btn.small{height:26px;padding:0 8px;font-size:12px}
.sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.zoomlabel{min-width:44px;text-align:center;color:var(--ink-3);font-size:12px}

/* ── 本体 ── */
.main{display:grid;grid-template-columns:220px 1fr 272px;min-height:0}
.tools{background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:10px 10px 16px}
.step{margin-bottom:14px}
.step-h{display:flex;align-items:center;gap:7px;font-weight:800;font-size:12px;color:var(--ink-2);margin:2px 2px 7px}
.step-h .n{width:19px;height:19px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;padding:6px 4px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:11.5px;color:var(--ink-2);position:relative;text-align:center;line-height:1.25}
.tool svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{border-color:var(--line-2);background:#f8fafc}
.tool.on{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d);font-weight:700}
.tool kbd{position:absolute;top:3px;right:5px;font-size:9px;color:var(--ink-4);font-family:inherit}
.tool.wide{grid-column:span 2;flex-direction:row;min-height:36px;gap:7px}
.tool.wide svg{width:18px;height:18px}
.furn-cats{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.chip{height:24px;padding:0 9px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:11.5px;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.furn-list{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.furn{display:flex;align-items:center;gap:6px;padding:6px 7px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:11.5px;text-align:left;line-height:1.2}
.furn .ic{font-size:16px}
.furn small{display:block;color:var(--ink-4);font-size:10px}
.furn.on{border-color:var(--blue);background:var(--blue-l)}
.bgbox{border:1px dashed var(--line-2);border-radius:var(--r);padding:8px;display:grid;gap:6px}
.row{display:flex;align-items:center;gap:6px}
.row label{color:var(--ink-3);font-size:11.5px;white-space:nowrap}
.row input[type=range]{flex:1;min-width:0}
details summary{cursor:pointer;color:var(--ink-3);font-size:11.5px;margin:2px 0}
.mini{font-size:11px;color:var(--ink-3);line-height:1.5}

/* ── キャンバス ── */
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:#fbfcfe}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;outline:none}
.hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:calc(100% - 20px);display:flex;align-items:center;gap:8px;background:rgba(15,23,42,.88);color:#fff;border-radius:999px;padding:7px 8px 7px 14px;font-size:12.5px;box-shadow:0 4px 18px rgba(15,23,42,.18);z-index:5}
.hint .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint .acts{display:flex;gap:5px;flex-shrink:0}
.hint .acts:empty{display:none}
.hint button{height:26px;padding:0 10px;border-radius:999px;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:12px;white-space:nowrap}
.hint button.ok{background:#22c55e;color:#04220f;font-weight:700}
.hint button:hover{filter:brightness(1.15)}
.numbox{position:absolute;z-index:6;display:none;align-items:center;gap:4px;background:#fff;border:2px solid var(--blue);border-radius:9px;padding:4px 6px;box-shadow:0 6px 20px rgba(15,23,42,.18)}
.numbox.show{display:flex}
.numbox span{font-size:11px;color:var(--ink-3);white-space:nowrap}
.numbox input{width:76px;border:0;outline:none;font-size:15px;font-weight:700;text-align:right}
.stat{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:11.5px;color:var(--ink-3);z-index:4;pointer-events:none}
.legend-toggle{position:absolute;right:10px;bottom:10px;display:flex;gap:5px;z-index:4}

/* ── プロパティ ── */
.props{background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;padding:12px}
.ph{font-weight:800;font-size:13px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.ph .tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--blue-l);color:var(--blue-d)}
.field{margin-bottom:10px}
.field>label{display:block;font-size:11.5px;color:var(--ink-3);margin-bottom:4px}
.in{width:100%;height:32px;border:1px solid var(--line-2);border-radius:8px;padding:0 9px;background:#fff;outline:none}
.in:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-m)}
.unit{position:relative}
.unit .in{padding-right:28px;text-align:right}
.unit::after{content:attr(data-u);position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--ink-4);font-size:11.5px;pointer-events:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chips .chip{height:22px;font-size:11px;padding:0 7px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line-2)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.big{display:flex;gap:10px;align-items:baseline;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;margin-bottom:12px}
.big b{font-size:20px}
.big span{color:var(--ink-3)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.seg button{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:11.5px}
.seg button.on{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d);font-weight:700}
.list{display:grid;gap:4px}
.li{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:left;width:100%}
.li:hover{border-color:var(--line-2)}
.li .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .v{color:var(--ink-3);font-size:11.5px;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.empty{color:var(--ink-3);line-height:1.7;font-size:12px;background:var(--bg);border:1px dashed var(--line-2);border-radius:var(--r);padding:12px}
.kbd-help{margin-top:14px;color:var(--ink-3);font-size:11px;line-height:1.8}
.kbd-help kbd{display:inline-block;min-width:18px;padding:0 4px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;font-family:inherit;font-size:10px;text-align:center;color:var(--ink-2);background:#fff}

/* ── モーダル ── */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal.show{display:flex}
.dialog{background:#fff;border-radius:14px;width:min(420px,100%);padding:16px;box-shadow:0 20px 60px rgba(15,23,42,.3)}
.dialog h3{margin:0 0 12px;font-size:15px}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.presets button{border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 4px;font-size:12px;line-height:1.3}
.presets button small{display:block;color:var(--ink-4);font-size:10px}
.presets button:hover{border-color:var(--blue);background:var(--blue-l)}
.viewer{position:fixed;inset:0;z-index:60;background:#0a0e1a;display:none}
.viewer.show{display:block}
.viewer iframe{width:100%;height:100%;border:0;display:block}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:12.5px;opacity:0;transition:all .25s;z-index:70;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── スマホ・狭い画面 ── */
@media (max-width: 860px){
  .main{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .tools{grid-row:2;border-right:0;border-top:1px solid var(--line);padding:6px;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;max-height:none;white-space:nowrap}
  .step{margin:0;display:flex;align-items:center;gap:6px}
  .step-h{writing-mode:horizontal-tb;margin:0}
  .step-h span:not(.n){display:none}
  .tgrid{display:flex;gap:5px}
  .tool{min-width:62px;min-height:50px}
  .tool.wide{grid-column:auto;flex-direction:column;min-height:50px}
  .tool kbd{display:none}
  .bg-step{display:none}
  .furn-step{display:flex}
  .furn-cats{display:none}
  .furn-list{display:flex;gap:5px}
  .furn{min-width:92px;min-height:50px}
  .props{position:fixed;left:0;right:0;bottom:0;max-height:48vh;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -10px 30px rgba(15,23,42,.15);transform:translateY(105%);transition:transform .22s;z-index:30;padding-top:6px}
  .props.open{transform:none}
  .props .grab{display:block}
  .top h1 small{display:none}
  .hide-sm{display:none !important}
  .hint{top:8px;font-size:12px}
}
.sm{display:none}
@media (max-width: 860px){ .lg{display:none} .sm{display:inline} }
@media (max-width: 480px){ .top h1{display:none} .top{gap:4px;padding:6px} .btn{padding:0 9px} }
.grab{display:none;width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:2px auto 10px}
.show-sm{display:none}
@media (max-width: 860px){ .show-sm{display:inline-flex} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>間取りエディタ<small id="propName"></small></h1>
    <button class="btn icon" id="bUndo" title="元に戻す (Ctrl+Z)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="btn icon" id="bRedo" title="やり直す (Ctrl+Y)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <span class="sep hide-sm"></span>
    <button class="btn icon hide-sm" id="bZoomOut" title="縮小">−</button>
    <span class="zoomlabel hide-sm" id="zoomLabel">100%</span>
    <button class="btn icon hide-sm" id="bZoomIn" title="拡大">＋</button>
    <button class="btn hide-sm" id="bFit" title="全体を表示 (0)">全体表示</button>
    <span class="spacer"></span>
    <button class="btn show-sm" id="bProps">詳細</button>
    <button class="btn" id="bWalk" title="3Dで歩いて確認">🚶<span class="lg"> 3Dで歩く</span><span class="sm"> 3D</span></button>
    <span class="sep"></span>
    <span id="fileBtns" class="row">
      <button class="btn hide-sm" id="bLoad">読み込み</button>
      <button class="btn" id="bDownload"><span class="lg">ファイルに保存</span><span class="sm">保存</span></button>
    </span>
    <span id="embedBtns" class="row" style="display:none">
      <button class="btn ghost" id="bCancel" title="保存せずに閉じる"><span class="lg">キャンセル</span><span class="sm">✕</span></button>
      <button class="btn primary" id="bSave"><span class="lg">保存して閉じる</span><span class="sm">保存</span></button>
    </span>
  </header>

  <div class="main">
    <!-- 左: 道具 -->
    <aside class="tools" id="tools">
      <div class="step">
        <div class="step-h"><span class="n">1</span><span>部屋をつくる</span></div>
        <div class="tgrid">
          <button class="tool" data-tool="select" title="選択・移動 (V)"><kbd>V</kbd><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-3 6z"/></svg>選択・移動</button>
          <button class="tool" data-tool="rect" title="四角い部屋 (R)"><kbd>R</kbd><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>四角い部屋</button>
          <button class="tool" data-tool="poly" title="自由な形の部屋 (P)"><kbd>P</kbd><svg viewBox="0 0 24 24"><path d="M4 5h9v6h7v8H4z"/></svg>L字など</button>
          <button class="tool" data-tool="wall" title="壁を引く (L)"><kbd>L</kbd><svg viewBox="0 0 24 24"><path d="M4 18 20 6" stroke-width="3.2"/></svg>壁だけ</button>
          <button class="tool wide" id="bAddRoom" title="サイズを数字で指定して部屋を追加"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/><path d="M8 12h8M12 8v8"/></svg>数字で部屋を追加</button>
        </div>
      </div>
      <div class="step">
        <div class="step-h"><span class="n">2</span><span>ドア・窓</span></div>
        <div class="tgrid">
          <button class="tool" data-tool="door" title="ドア (D)"><kbd>D</kbd><svg viewBox="0 0 24 24"><path d="M5 19V5"/><path d="M5 5a14 14 0 0 1 14 14"/><path d="M5 19h14"/></svg>ドア</button>
          <button class="tool" data-tool="window" title="窓 (W)"><kbd>W</kbd><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="6"/><path d="M3 12h18"/></svg>窓</button>
          <button class="tool" data-tool="passage" title="通路・開口 (O)"><kbd>O</kbd><svg viewBox="0 0 24 24"><path d="M3 12h5M16 12h5" stroke-width="3"/><path d="M9 12h6" stroke-dasharray="2 2"/></svg>通路</button>
        </div>
      </div>
      <div class="step furn-step">
        <div class="step-h"><span class="n">3</span><span>家具を置く</span></div>
        <div class="furn-cats" id="furnCats"></div>
        <div class="furn-list" id="furnList"></div>
      </div>
      <div class="step bg-step">
        <div class="step-h"><span class="n" style="background:#64748b">＋</span><span>下絵(間取り図の画像)</span></div>
        <div class="bgbox">
          <button class="btn primary" id="bAutoFromImage" title="間取り図の画像から部屋・ドア・窓をまとめて作ります">✨ 画像から自動で作る</button>
          <button class="btn" id="bBgLoad">画像を読み込む</button>
          <div id="bgCtl" style="display:none;gap:6px" class="bgctl">
            <div class="row"><label>濃さ</label><input type="range" id="bgOpacity" min="10" max="100" value="55"></div>
            <div class="tgrid" style="margin-top:4px">
              <button class="tool" data-tool="calib" title="図面上の2点と実際の長さで大きさを合わせる"><svg viewBox="0 0 24 24"><path d="M4 17 17 4l3 3L7 20z"/><path d="M8 13l2 2M11 10l2 2M14 7l2 2"/></svg>長さを合わせる</button>
              <button class="tool" data-tool="bgmove" title="下絵をドラッグで動かす"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg>下絵を動かす</button>
              <button class="tool" data-tool="roomfill" title="下絵の部屋の内側をクリックして部屋を自動作成"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 8h8v8H8z" fill="currentColor" opacity=".25"/></svg>部屋を自動取得</button>
              <button class="tool" data-tool="autowall" title="下絵から壁の線を自動検出"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h16" stroke-width="2.6"/></svg>壁を自動検出</button>
            </div>
            <details>
              <summary>検出の細かい設定</summary>
              <div class="row"><label>暗さのしきい値</label><input type="range" id="pThreshold" min="30" max="230" value="110"><span id="pThresholdV" class="mini">110</span></div>
              <div class="row"><label>色みの許容</label><input type="range" id="pSat" min="10" max="160" value="60"></div>
              <div class="row"><label>壁の厚み(m)</label><input class="in" style="height:26px" id="pMinTh" type="number" step="0.01" value="0.06"><span class="mini">〜</span><input class="in" style="height:26px" id="pMaxTh" type="number" step="0.01" value="0.30"></div>
              <div class="row"><label>最短の壁(m)</label><input class="in" style="height:26px" id="pMinLen" type="number" step="0.1" value="0.4"></div>
              <div class="row"><label>開口を塞ぐ(m)</label><input class="in" style="height:26px" id="pClose" type="number" step="0.05" value="1.0"></div>
              <div class="row"><button class="btn small" id="bOtsu">しきい値を自動で決める</button></div>
            </details>
            <button class="btn small danger" id="bBgClear">下絵を消す</button>
          </div>
        </div>
      </div>
    </aside>

    <!-- 中央: キャンバス -->
    <section class="stage" id="stage">
      <canvas id="cv" tabindex="0"></canvas>
      <div class="hint" id="hint"><span class="txt" id="hintTxt"></span><span class="acts" id="hintActs"></span></div>
      <div class="numbox" id="numbox"><span id="numLabel">長さ</span><input id="numInput" inputmode="decimal" autocomplete="off"><span>m</span></div>
      <div class="stat" id="stat"></div>
      <div class="legend-toggle hide-sm">
        <select class="btn small" id="gridSel" title="スナップ(吸着)の間隔">
          <option value="0.05">吸着 5cm</option>
          <option value="0.1" selected>吸着 10cm</option>
          <option value="0.455">吸着 半間(45.5cm)</option>
          <option value="0">吸着なし</option>
        </select>
        <button class="btn small" id="bDims" title="すべての部屋の寸法を表示">寸法: 選択中のみ</button>
      </div>
    </section>

    <!-- 右: 詳細 -->
    <aside class="props" id="props"><div class="grab"></div><div id="propsBody"></div></aside>
  </div>
</div>

<!-- 数字で部屋を追加 -->
<div class="modal" id="autoModal">
  <div class="dialog">
    <h3>✨ 画像から自動で作る</h3>

/* ───────── 状態 ───────── */
let plan = { rooms: [], furnitures: [], walls: [] };
let nextId = 1;
const newId = () => nextId++;
let tool = 'select';
let selection = [];               // [{kind:'room'|'opening'|'furn'|'wall', obj, room}]
let view = { scale: 1.2, ox: 0, oy: 0 };
let gridM = 0.1;
let showAllDims = false;
let embedded = window.parent !== window;
let propName = '';
let furnPick = null;              // 置こうとしている家具の定義
let furnCat = 'リビング';
let bg = null;                    // { img, x, y, scale, opacity }
const undoStack = [], redoStack = [];
let clipboard = null, pasteCount = 0;

// 操作中の一時状態
let drag = null;                  // ドラッグ中の情報
let draft = null;                 // 描画中の部屋・壁 { pts:[], kind }
let hover = null;                 // カーソル位置(ワールド)
let snapInfo = null;              // スナップ表示用
let openingPreview = null;
let autoWallPreview = null, awRegion = null;
let roomFillPreview = [];
let calib = null;                 // 長さ合わせ { p1, p2 }
let shiftDown = false, spaceDown = false;
const pointers = new Map();       // ピンチ用

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

/* ───────── 小物 ───────── */
const fmtM = px => (px / M).toFixed(2) + 'm';
const toast = (msg) => { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function polyArea2(v) { let a = 0; for (let i = 0; i < v.length; i++) { const p = v[i], q = v[(i + 1) % v.length]; a += p.x * q.y - q.x * p.y; } return a; }

  let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < v.length; i++) { const p = v[i], q = v[(i + 1) % v.length], f = p.x * q.y - q.x * p.y; a += f; cx += (p.x + q.x) * f; cy += (p.y + q.y) * f; }
  if (Math.abs(a) < 1e-6) { const s = v.reduce((o, p) => ({ x: o.x + p.x, y: o.y + p.y }), { x: 0, y: 0 }); return { x: s.x / v.length, y: s.y / v.length }; }

}
function pointInPoly(p, v) {
  let inside = false;
  for (let i = 0, j = v.length - 1; i < v.length; j = i++) {
    const a = v[i], b = v[j];
    if ((a.y > p.y) !== (b.y > p.y) && p.x < (b.x - a.x) * (p.y - a.y) / (b.y - a.y) + a.x) inside = !inside;

}

  t = clamp(t, 0, 1);

}
function edgeInfo(room, i) {
  const v = room.vertices, a = v[i], b = v[(i + 1) % v.length];
  const len = dist(a, b) || 1e-9, ux = (b.x - a.x) / len, uy = (b.y - a.y) / len;
  const s = polyArea2(v) > 0 ? 1 : -1;

function bbox(points) {
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  points.forEach(p => { x1 = Math.min(x1, p.x); y1 = Math.min(y1, p.y); x2 = Math.max(x2, p.x); y2 = Math.max(y2, p.y); });

}

  const v = room.vertices;
  if (v.length !== 4) return false;
  for (let i = 0; i < 4; i++) { const a = v[i], b = v[(i + 1) % 4]; if (Math.abs(a.x - b.x) > 0.5 && Math.abs(a.y - b.y) > 0.5) return false; }

}

  const r = (f.rotation || 0) * Math.PI / 180, c = Math.cos(r), s = Math.sin(r), hw = f.w * M / 2, hd = f.d * M / 2;
  return [[-hw, -hd], [hw, -hd], [hw, hd], [-hw, hd]].map(([x, y]) => ({ x: f.cx + x * c - y * s, y: f.cy + x * s + y * c }));
}

/* ───────── 座標変換 ───────── */
let dpr = 1;
function toScreen(p) { return { x: p.x * view.scale + view.ox, y: p.y * view.scale + view.oy }; }

function evWorld(e) { const r = cv.getBoundingClientRect(); return toWorld(e.clientX - r.left, e.clientY - r.top); }

/* ───────── データの出し入れ ───────── */
function serialize() { return JSON.stringify(plan); }
function restore(json) { plan = JSON.parse(json); selection = []; refreshAll(); }

function importData(data) {
  const rooms = [], furnitures = [], walls = [];
  (data && data.rooms || []).forEach((r, ri) => {
    let verts, openings = [];
    if (Array.isArray(r.vertices) && r.vertices.length >= 3) {
      verts = r.vertices.map(v => ({ x: +v.x || 0, y: +v.y || 0 }));
      (r.openings || []).forEach(o => {
        if (o.edgeIndex === undefined) return;
        openings.push(normOpening(o, o.edgeIndex, o.offsetAlongWall));
      });
    } else {
      const x = +r.wx || 0, y = +r.wy || 0, w = +r.ww || 0, h = +r.wh || 0;
      if (w <= 0 || h <= 0) return;
      verts = [{ x, y }, { x: x + w, y }, { x: x + w, y: y + h }, { x, y: y + h }];
      // 旧形式(壁の向き+左/上からの割合)→ 辺番号に変換
      (r.openings || []).forEach(o => {
        let a = +o.offsetAlongWall; if (!(a > 0)) a = 0.5; if (a > 1) a = 0.5;
        const map = { North: [0, a], East: [1, a], South: [2, 1 - a], West: [3, 1 - a] }[o.wall];
        if (map) openings.push(normOpening(o, map[0], map[1]));

    }
    rooms.push({ id: newId(), name: r.name || ('部屋' + (ri + 1)), color: r.color || ROOM_COLORS[ri % ROOM_COLORS.length], vertices: verts, openings, groupId: r.groupId || null });
  });

    furnitures.push({ id: newId(), type: f.type || 'custom', name: f.name || '家具', icon: f.icon || '▪', cx: +f.cx || 0, cy: +f.cy || 0, w, d, h: +f.h || 0.8, rotation: +f.rotation || 0, color: f.color || '#888888' });
  });
  ((data && data.walls) || []).forEach(w => walls.push({ id: newId(), x1: +w.x1 || 0, y1: +w.y1 || 0, x2: +w.x2 || 0, y2: +w.y2 || 0 }));
  return { rooms, furnitures, walls };
}
function normOpening(o, edgeIndex, along) {
  const type = o.type === 'window' ? 'window' : o.type === 'passage' ? 'passage' : 'door';
  const d = OPENING_DEFAULTS[type];
  let a = +along; if (!(a > 0 && a < 1)) a = 0.5;
  const op = { type, edgeIndex: +edgeIndex, offsetAlongWall: a, width: +o.width || d.width, height: +o.height || d.height };

}
function exportData() {
  return {
    rooms: plan.rooms.map(r => {
      const b = bbox(r.vertices);
      return { id: r.id, name: r.name, color: r.color, groupId: r.groupId || null,
        wx: b.x1, wy: b.y1, ww: b.x2 - b.x1, wh: b.y2 - b.y1,
        vertices: r.vertices.map(v => ({ x: Math.round(v.x * 100) / 100, y: Math.round(v.y * 100) / 100 })),
        openings: r.openings.map(o => Object.assign({}, o)) };
    }),
    furnitures: plan.furnitures.map(f => ({ id: f.id, type: f.type, name: f.name, icon: f.icon, cx: f.cx, cy: f.cy, w: f.w, d: f.d, h: f.h, pw: f.w * M, ph: f.d * M, rotation: f.rotation, color: f.color })),
    walls: plan.walls.map(w => ({ id: w.id, x1: w.x1, y1: w.y1, x2: w.x2, y2: w.y2 }))

/* ───────── 履歴(元に戻す/やり直す)───────── */
let pendingSnap = null;
function beginChange() { if (pendingSnap === null) pendingSnap = serialize(); }
function endChange() {
  if (pendingSnap === null) return;
  const now = serialize();
  if (now !== pendingSnap) { undoStack.push(pendingSnap); if (undoStack.length > 150) undoStack.shift(); redoStack.length = 0; autosave(); }
  pendingSnap = null;
  updateUndoButtons();
}
function change(fn) { beginChange(); fn(); endChange(); refreshAll(); }
function undo() { if (!undoStack.length) return; cancelDraft(); redoStack.push(serialize()); restore(undoStack.pop()); updateUndoButtons(); autosave(); }
function redo() { if (!redoStack.length) return; cancelDraft(); undoStack.push(serialize()); restore(redoStack.pop()); updateUndoButtons(); autosave(); }
function updateUndoButtons() { $('bUndo').disabled = !undoStack.length; $('bRedo').disabled = !redoStack.length; }
function autosave() {
  if (embedded) return;
  try { localStorage.setItem('vrhomes_editor_draft', serialize()); } catch (e) { /* 容量不足など */ }
}

/* ───────── スナップ(吸着)───────── */
function allVertices(excludeRoom) {
  const out = [];
  plan.rooms.forEach(r => { if (r !== excludeRoom) r.vertices.forEach(v => out.push(v)); });
  plan.walls.forEach(w => { out.push({ x: w.x1, y: w.y1 }); out.push({ x: w.x2, y: w.y2 }); });
  return out;
}
function allEdges(excludeRoom) {
  const out = [];
  plan.rooms.forEach(r => { if (r === excludeRoom) return; r.vertices.forEach((v, i) => out.push([v, r.vertices[(i + 1) % r.vertices.length]])); });
  plan.walls.forEach(w => out.push([{ x: w.x1, y: w.y1 }, { x: w.x2, y: w.y2 }]));
  return out;
}
function gridSnap(v) { const g = gridM * M; return g > 0 ? Math.round(v / g) * g : v; }
/* p を吸着させる。優先度: 他の頂点 > 他の辺 > 縦横の揃え > グリッド */
function snapPoint(p, opt) {
  opt = opt || {};
  snapInfo = null;
  if (shiftDown || gridM === 0 && !opt.force) return { x: p.x, y: p.y };
  const t = 10 / view.scale;
  const verts = (opt.extraVerts || []).concat(allVertices(opt.excludeRoom)).filter(v => v !== opt.excludeVertex);
  let best = null, bd = t;
  verts.forEach(v => { const d = dist(p, v); if (d < bd) { bd = d; best = v; } });
  if (best) { snapInfo = { kind: 'vertex', p: { x: best.x, y: best.y } }; return { x: best.x, y: best.y }; }
  if (!opt.noEdge) {
    let be = null; bd = t * 0.8;
    allEdges(opt.excludeRoom).forEach(([a, b]) => { const s = segDist(p, a, b); if (s.d < bd) { bd = s.d; be = s.q; } });
    if (be) {
      // 辺の上で、グリッドにも合わせる(縦横の辺のとき)
      const q = { x: be.x, y: be.y };
      snapInfo = { kind: 'edge', p: q };
      return q;
    }
  }
  const r = { x: gridSnap(p.x), y: gridSnap(p.y) };
  let gx = null, gy = null;
  verts.forEach(v => {
    if (Math.abs(v.x - p.x) < t && (gx === null || Math.abs(v.x - p.x) < Math.abs(gx.x - p.x))) gx = v;
    if (Math.abs(v.y - p.y) < t && (gy === null || Math.abs(v.y - p.y) < Math.abs(gy.y - p.y))) gy = v;
  });
  if (gx) r.x = gx.x;
  if (gy) r.y = gy.y;
  if (gx || gy) snapInfo = { kind: 'align', p: r, gx, gy };

}
/* 直前の点から縦横にそろえる(Shiftで自由) */
function orthoFrom(prev, p) {
  if (!prev || shiftDown) return p;
  const dx = p.x - prev.x, dy = p.y - prev.y;
  return Math.abs(dx) >= Math.abs(dy) ? { x: p.x, y: prev.y } : { x: prev.x, y: p.y };
}

/* ───────── 開口(ドア・窓)───────── */
function openingGeom(room, o) {
  const e = edgeInfo(room, o.edgeIndex);
  const c = o.offsetAlongWall * e.len, w = o.width * M;
  const l = clamp(c - w / 2, 0, e.len), r = clamp(c + w / 2, 0, e.len);
  const P = t => ({ x: e.a.x + e.ux * t, y: e.a.y + e.uy * t });
  return { e, c, l, r, w: r - l, p1: P(l), p2: P(r), mid: P(c), P };

// 他の部屋の重なった辺にある開口も、穴として扱う(描画用)
function holesForEdge(room, i) {
  const e = edgeInfo(room, i), holes = [];
  room.openings.forEach(o => { if (o.edgeIndex === i) { const g = openingGeom(room, o); holes.push([g.l, g.r]); } });
  plan.rooms.forEach(r2 => {
    if (r2 === room) return;
    r2.openings.forEach(o => {
      const g = openingGeom(r2, o);
      if (Math.abs(e.ux * g.e.uy - e.uy * g.e.ux) > 0.08) return;
      const rx = g.mid.x - e.a.x, ry = g.mid.y - e.a.y;
      if (Math.abs(rx * -e.uy + ry * e.ux) > WALL_DRAW_T * M * 1.6) return;

/* ───────── 描画 ───────── */
function resize() {

  dpr = Math.min(window.devicePixelRatio || 1, 2);

}
let drawQueued = false;

function render() {

  }

  // 部屋の床
  plan.rooms.forEach(r => {
    tracePoly(r.vertices);
    ctx.fillStyle = hexA(r.color, sel.has(r) ? 0.28 : 0.16);
    ctx.fill();
  });
  // 壁
  ctx.lineCap = 'butt';
  plan.rooms.forEach(r => r.vertices.forEach((v, i) => {
    const e = edgeInfo(r, i), holes = holesForEdge(r, i);
    let cur = 0;
    ctx.strokeStyle = sel.has(r) ? '#1d4ed8' : '#1e293b';
    ctx.lineWidth = WALL_DRAW_T * M;
    const seg = (t1, t2) => { if (t2 - t1 < 0.5) return; ctx.beginPath(); ctx.moveTo(e.a.x + e.ux * t1, e.a.y + e.uy * t1); ctx.lineTo(e.a.x + e.ux * t2, e.a.y + e.uy * t2); ctx.stroke(); };
    holes.forEach(h => { if (h[0] > cur) seg(cur, h[0]); cur = Math.max(cur, h[1]); });

  });

    ctx.strokeStyle = 'rgba(234,88,12,.9)'; ctx.lineWidth = px(4); ctx.lineCap = 'round';
    autoWallPreview.forEach(s => { ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke(); });
  }
  if (awRegion) { ctx.setLineDash([px(6), px(4)]); ctx.strokeStyle = '#ea580c'; ctx.lineWidth = px(1.5); ctx.strokeRect(Math.min(awRegion.x1, awRegion.x2), Math.min(awRegion.y1, awRegion.y2), Math.abs(awRegion.x2 - awRegion.x1), Math.abs(awRegion.y2 - awRegion.y1)); ctx.setLineDash([]); }

    ctx.fillStyle = 'rgba(37,99,235,.08)'; ctx.strokeStyle = '#2563eb'; ctx.lineWidth = px(1); ctx.setLineDash([px(4), px(3)]);
    ctx.fillRect(Math.min(b.p0.x, b.p1.x), Math.min(b.p0.y, b.p1.y), Math.abs(b.p1.x - b.p0.x), Math.abs(b.p1.y - b.p0.y));

    ctx.setLineDash([]);

}

      plan.walls.forEach(w => { if (inB({ x: w.x1, y: w.y1 }) && inB({ x: w.x2, y: w.y2 }) && !picked.some(s => s.obj === w)) picked.push({ kind: 'wall', obj: w }); });
      drag = null; setSelection(picked); return;
    }
  }
  else if (k === 'rect') {
    const moved = dist(draft.p0, draft.cursor) * view.scale;
    if (moved < 6) { draft.clickMode = true; drag = null; setHint('もう一方の角をクリック'); return draw(); }
    finishRect();
  }
  else if (k === 'vertex') {
    const r = drag.room;
    // 隣の角と重なったら消す
    const n = r.vertices.length, v = r.vertices[drag.i];
    if (n > 3 && (dist(v, r.vertices[(drag.i + 1) % n]) < 1 || dist(v, r.vertices[(drag.i - 1 + n) % n]) < 1)) { r.vertices.splice(drag.i, 1); }
    remapOpenings(r, drag.before);
    endChange();
  }
  else if (k === 'awregion') {
    if (Math.abs(awRegion.x2 - awRegion.x1) * view.scale < 8) awRegion = null;
    drag = null; runAutoWall(); return;
  }
  else if (['move', 'edge', 'opening', 'wallEnd', 'rotate'].includes(k)) endChange();
  snapInfo = null;
  drag = null;
  renderProps(); draw();
}

function onDbl(e) {
  const p = evWorld(e);
  if (tool === 'poly' && draft && draft.pts.length >= 3) { finishPoly(); return; }
  if (tool === 'wall' && draft) { draft = null; updateHint(); draw(); return; }
  if (tool !== 'select') return;
  if (selection.length === 1 && selection[0].kind === 'room') {
    const r = selection[0].obj, t = 9 / view.scale;
    const i = r.vertices.findIndex(v => dist(v, p) < t);
    if (i >= 0 && r.vertices.length > 3) {
      change(() => { const before = openingMids(r); r.vertices.splice(i, 1); remapOpenings(r, before); });
      toast('角を削除しました');
      return;
    }
  }
  const h = hitTest(p);
  if (h && h.kind === 'room') { setSelection([{ kind: 'room', obj: h.obj }]); setTimeout(() => { const el = $('pName'); if (el) { el.focus(); el.select(); } }, 30); }
}

/* ───────── 部屋・壁を描く ───────── */
function finishRect() {
  const a = draft.p0, b = draft.cursor;
  const x1 = Math.min(a.x, b.x), y1 = Math.min(a.y, b.y), x2 = Math.max(a.x, b.x), y2 = Math.max(a.y, b.y);
  drag = null;
  if ((x2 - x1) < 0.3 * M || (y2 - y1) < 0.3 * M) { draft = null; toast('部屋が小さすぎます(30cm以上)'); updateHint(); return draw(); }
  addRoom([{ x: x1, y: y1 }, { x: x2, y: y1 }, { x: x2, y: y2 }, { x: x1, y: y2 }]);
  draft = null; updateHint();
}
function addRoom(verts, name) {
  const room = { id: newId(), name: name || suggestName(), color: ROOM_COLORS[plan.rooms.length % ROOM_COLORS.length], vertices: verts, openings: [], groupId: null };
  change(() => plan.rooms.push(room));
  setSelection([{ kind: 'room', obj: room }]);
  return room;
}
function suggestName() {
  if (!plan.rooms.length) return 'LDK';
  const used = new Set(plan.rooms.map(r => r.name));
  for (const n of ['洋室', '洋室2', '洋室3', '寝室', '和室']) if (!used.has(n)) return n;
  return '部屋' + (plan.rooms.length + 1);
}
function currentDraftPoint(p) {
  const prev = draft && draft.pts.length ? draft.pts[draft.pts.length - 1] : null;
  let q = snapPoint(orthoFrom(prev, p), { extraVerts: draft ? draft.pts : [] });
  if (prev && !shiftDown && snapInfo && snapInfo.kind !== 'vertex') q = orthoFrom(prev, q);
  return q;
}
function clickPoly(p) {
  const q = currentDraftPoint(p);
  if (!draft) draft = { kind: 'poly', pts: [] };
  if (draft.pts.length >= 3 && dist(q, draft.pts[0]) < 10 / view.scale) { finishPoly(); return; }
  if (draft.pts.length && dist(q, draft.pts[draft.pts.length - 1]) < 1) return;
  draft.pts.push(q); draft.cursor = q;
  updateHint(); draw();
}
function finishPoly() {
  if (!draft || draft.pts.length < 3) return;
  const pts = draft.pts.slice();
  draft = null; closeNumbox();
  if (polyAreaM2(pts) < 0.1) { toast('形が小さすぎます'); updateHint(); return draw(); }
  addRoom(pts);
  updateHint();
}
function clickWall(p) {
  const q = currentDraftPoint(p);
  if (!draft) { draft = { kind: 'wall', pts: [q], cursor: q }; updateHint(); return draw(); }
  const a = draft.pts[draft.pts.length - 1];
  if (dist(a, q) < 0.05 * M) return;
  change(() => plan.walls.push({ id: newId(), x1: a.x, y1: a.y, x2: q.x, y2: q.y }));
  draft.pts = [q]; draft.cursor = q;
  updateHint(); draw();
}
// 数字で長さを指定して次の点へ
function applyLength(m) {
  if (!draft || !draft.pts.length || !(m > 0)) return;
  const a = draft.pts[draft.pts.length - 1];
  let c = draft.cursor && dist(draft.cursor, a) > 0.5 ? draft.cursor : { x: a.x + 1, y: a.y };
  const d = dist(c, a), q = { x: a.x + (c.x - a.x) / d * m * M, y: a.y + (c.y - a.y) / d * m * M };
  if (tool === 'poly') { draft.pts.push(q); draft.cursor = q; }
  else if (tool === 'wall') { change(() => plan.walls.push({ id: newId(), x1: a.x, y1: a.y, x2: q.x, y2: q.y })); draft.pts = [q]; draft.cursor = q; }
  updateHint(); draw();
}

/* ───────── 数字入力ボックス ───────── */
let numboxMode = null;
function openNumbox(label, initial) {
  const nb = $('numbox');
  $('numLabel').textContent = label;
  nb.classList.add('show');
  let pt = null;
  if (tool === 'calib' && calib && calib.p2) pt = toScreen({ x: (calib.p1.x + calib.p2.x) / 2, y: (calib.p1.y + calib.p2.y) / 2 });
  else if (draft && draft.cursor) pt = toScreen(draft.cursor);
  const r = $('stage').getBoundingClientRect();
  const x = pt ? clamp(pt.x + 14, 8, r.width - 170) : r.width / 2 - 80, y = pt ? clamp(pt.y + 14, 50, r.height - 50) : 60;
  nb.style.left = x + 'px'; nb.style.top = y + 'px';
  const inp = $('numInput'); inp.value = initial || ''; inp.focus();
  numboxMode = tool;
}
function closeNumbox() { $('numbox').classList.remove('show'); numboxMode = null; }
$('numInput').addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter') {
    const v = parseFloat($('numInput').value.replace(/[^0-9.]/g, ''));
    if (numboxMode === 'calib') { applyCalib(v); }

    if (numboxMode !== 'poly' && numboxMode !== 'wall') closeNumbox();
    cv.focus();
  } else if (e.key === 'Escape') { closeNumbox(); cv.focus(); }
});

/* ───────── ドア・窓 ───────── */
function placeOpening(p) {
  const ne = nearestRoomEdge(p, 14 / view.scale);
  if (!ne) { toast('部屋の壁の上をクリックしてください'); return; }
  const def = OPENING_DEFAULTS[tool];
  if (ne.e.len < def.width * M * 0.6) { toast('この壁は短すぎます'); return; }
  let tLen = ne.t * ne.e.len; if (!shiftDown) tLen = Math.round(tLen / (0.05 * M)) * (0.05 * M);
  const o = { type: tool, edgeIndex: ne.i, offsetAlongWall: clampAlong(ne.e, Math.min(def.width, ne.e.len / M), tLen / ne.e.len), width: Math.min(def.width, +(ne.e.len / M).toFixed(2)), height: def.height };
  if (tool === 'door') o.doorType = currentDoorType;
  change(() => ne.room.openings.push(o));
  setSelection([{ kind: 'opening', obj: o, room: ne.room }]);
}

/* ───────── 家具 ───────── */
function renderFurnCats() {
  $('furnCats').innerHTML = Object.keys(FURNITURE).map(c => `<button class="chip ${c === furnCat ? 'on' : ''}" data-cat="${c}">${c}</button>`).join('');
  $('furnCats').querySelectorAll('.chip').forEach(b => b.onclick = () => { furnCat = b.dataset.cat; renderFurnCats(); renderFurnList(); });
}

  $('furnList').querySelectorAll('.furn').forEach(b => b.onclick = () => { const f = FURNITURE[furnCat][+b.dataset.i]; if (furnPick && furnPick.id === f.id) { setTool('select'); return; } setTool('furniture'); furnPick = f; renderFurnList(); updateHint(); });
}
function placeFurniture(p) {
  if (!furnPick) return;
  const q = shiftDown ? p : { x: gridSnap(p.x), y: gridSnap(p.y) };
  const f = { id: newId(), type: furnPick.id, name: furnPick.name, icon: furnPick.icon, cx: q.x, cy: q.y, w: furnPick.w, d: furnPick.d, h: furnPick.h, rotation: 0, color: furnPick.color };

/* ───────── 削除・コピー ───────── */
function deleteSelection() {
  if (!selection.length) return;
  change(() => {
    selection.forEach(s => {
      if (s.kind === 'room') plan.rooms = plan.rooms.filter(r => r !== s.obj);
      if (s.kind === 'furn') plan.furnitures = plan.furnitures.filter(f => f !== s.obj);
      if (s.kind === 'wall') plan.walls = plan.walls.filter(w => w !== s.obj);
      if (s.kind === 'opening') s.room.openings = s.room.openings.filter(o => o !== s.obj);
    });
  });
  setSelection([]);
}
function copySelection() {
  const items = selection.filter(s => s.kind !== 'opening');
  if (!items.length) return false;
  clipboard = JSON.stringify(items.map(s => ({ kind: s.kind, obj: s.obj })));
  pasteCount = 0;
  return true;
}
function paste() {
  if (!clipboard) return;
  pasteCount++;
  const off = 0.5 * M * pasteCount, items = JSON.parse(clipboard), added = [];
  change(() => items.forEach(it => {
    const o = it.obj; o.id = newId();
    if (it.kind === 'room') { o.vertices.forEach(v => { v.x += off; v.y += off; }); plan.rooms.push(o); }
    if (it.kind === 'furn') { o.cx += off; o.cy += off; plan.furnitures.push(o); }
    if (it.kind === 'wall') { o.x1 += off; o.y1 += off; o.x2 += off; o.y2 += off; plan.walls.push(o); }
    added.push({ kind: it.kind, obj: o });
  }));
  setSelection(added);
}
function duplicate() { if (copySelection()) paste(); }
function nudge(dx, dy) {
  if (!selection.length) return;
  change(() => selection.forEach(s => {
    if (s.kind === 'room') s.obj.vertices.forEach(v => { v.x += dx; v.y += dy; });
    if (s.kind === 'furn') { s.obj.cx += dx; s.obj.cy += dy; }
    if (s.kind === 'wall') { s.obj.x1 += dx; s.obj.y1 += dy; s.obj.x2 += dx; s.obj.y2 += dy; }
  }));
}

/* ───────── キーボード ───────── */
window.addEventListener('keydown', e => {
  if (e.key === 'Shift') { shiftDown = true; updateHint(); }
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName);
  if (typing) return;
  if (e.key === ' ') { spaceDown = true; cv.style.cursor = 'grab'; e.preventDefault(); return; }
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (mod && e.key.toLowerCase() === 'c') { if (copySelection()) toast('コピーしました'); return; }
  if (mod && e.key.toLowerCase() === 'v') { e.preventDefault(); paste(); return; }
  if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicate(); return; }
  if (mod && e.key.toLowerCase() === 'a') { e.preventDefault(); setTool('select'); setSelection(plan.rooms.map(r => ({ kind: 'room', obj: r })).concat(plan.furnitures.map(f => ({ kind: 'furn', obj: f })), plan.walls.map(w => ({ kind: 'wall', obj: w })))); return; }
  if (mod) return;
  if (e.key === 'Escape') {
    if (draft) { if (tool === 'poly' && draft.pts.length > 1) { draft.pts.pop(); } else draft = null; updateHint(); return draw(); }
    if (tool !== 'select') return setTool('select');
    return setSelection([]);
  }
  if (e.key === 'Enter') { if (tool === 'poly' && draft && draft.pts.length >= 3) finishPoly(); else if (tool === 'wall') { draft = null; updateHint(); draw(); } return; }
  if ((tool === 'poly' || tool === 'wall') && draft && draft.pts.length && /^[0-9.]$/.test(e.key)) { e.preventDefault(); openNumbox('長さ', e.key); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (draft && draft.pts && draft.pts.length) { draft.pts.pop(); if (!draft.pts.length) draft = null; updateHint(); return draw(); }
    e.preventDefault(); deleteSelection(); return;
  }
  const step = (e.shiftKey ? 0.5 : (gridM || 0.05)) * M;
  if (e.key === 'ArrowLeft') { e.preventDefault(); return nudge(-step, 0); }
  if (e.key === 'ArrowRight') { e.preventDefault(); return nudge(step, 0); }
  if (e.key === 'ArrowUp') { e.preventDefault(); return nudge(0, -step); }
  if (e.key === 'ArrowDown') { e.preventDefault(); return nudge(0, step); }
  const map = { v: 'select', r: 'rect', p: 'poly', l: 'wall', d: 'door', w: 'window', o: 'passage' };
  if (map[e.key.toLowerCase()]) return setTool(map[e.key.toLowerCase()]);
  if (e.key === '0') return fitView();
  if (e.key === '+' || e.key === '=') return zoomAt(cv.clientWidth / 2, cv.clientHeight / 2, 1.25);
  if (e.key === '-') return zoomAt(cv.clientWidth / 2, cv.clientHeight / 2, 0.8);
});
window.addEventListener('keyup', e => {
  if (e.key === 'Shift') { shiftDown = false; updateHint(); }
  if (e.key === ' ') { spaceDown = false; cv.style.cursor = tool === 'select' ? 'default' : 'crosshair'; }
});

/* ───────── 詳細パネル ───────── */
function renderPropsLive() {
  // ドラッグ中は数値だけ更新(入力欄を作り直さない)

  if (s.kind === 'room') {
    const a = polyAreaM2(s.obj.vertices);
    const el = $('pArea'); if (el) el.innerHTML = `<b>${(a / TATAMI).toFixed(1)}帖</b><span>${a.toFixed(2)}㎡</span>`;
    if (isAxisRect(s.obj)) { const b = bbox(s.obj.vertices); setVal('pW', ((b.x2 - b.x1) / M).toFixed(2)); setVal('pD', ((b.y2 - b.y1) / M).toFixed(2)); }
  }
  if (s.kind === 'opening') { const g = openingGeom(s.room, s.obj); setVal('oPos', (g.l / M).toFixed(2)); }
  if (s.kind === 'furn') setVal('fRot', Math.round(s.obj.rotation));

function numField(id, label, value, unit, step) {

}
function onNum(id, fn) { const el = $(id); if (!el) return; el.addEventListener('change', () => { const v = parseFloat(el.value); if (isFinite(v)) fn(v); }); el.addEventListener('keydown', e => { if (e.key === 'Enter') el.blur(); }); }

/* 下絵の解析(以前のエディタの処理をそのまま移植) */

  const w = Math.max(1, Math.round(iw * s)), h = Math.max(1, Math.round(ih * s));

}

  const maxSat = P('pSat'), hist = new Float64Array(256), d = im.data; let total = 0;
  for (let i = 0, p = 0; i < im.w * im.h; i++, p += 4) {
    if (d[p + 3] < 128) continue;
    const mx = Math.max(d[p], d[p + 1], d[p + 2]), mn = Math.min(d[p], d[p + 1], d[p + 2]);

  for (let t = 0; t < 256; t++) {

    const wF = total - wB; if (wF <= 0) break;
    sumB += t * hist[t];
    const mB = sumB / wB, mF = (sum - sumB) / wF, v = wB * wF * (mB - mF) * (mB - mF);
    if (v > maxVar) { maxVar = v; best = t; }
  }
  $('pThreshold').value = best; $('pThresholdV').textContent = best;
  rfCache = null;
  if (tool === 'autowall') runAutoWall();
  toast('しきい値を ' + best + ' にしました');
}
function runAutoWall() {
  if (!bg || tool !== 'autowall') return;
  autoWallPreview = detectWallsFromBg();
  updateHint(); draw();
}
function commitAutoWalls() {
  if (!autoWallPreview || !autoWallPreview.length) { toast('追加できる壁がありません'); return; }
  const n = autoWallPreview.length;
  change(() => autoWallPreview.forEach(s => plan.walls.push({ id: newId(), x1: s.x1, y1: s.y1, x2: s.x2, y2: s.y2 })));
  autoWallPreview = null; awRegion = null;

  setTool('select');
}
function detectWallsFromBg() {
  const threshold = P('pThreshold'), maxSat = P('pSat'), minThM = P('pMinTh'), maxThM = P('pMaxTh'), minLenM = P('pMinLen');
  const im = getBgAnalysisImage(); if (!im) return [];
  const d = im.data, w = im.w, h = im.h, s = im.s;
  const dark = new Uint8Array(w * h);
  for (let i = 0, p = 0; i < w * h; i++, p += 4) {

    const mx = Math.max(d[p], d[p + 1], d[p + 2]), mn = Math.min(d[p], d[p + 1], d[p + 2]);

    ry1 = Math.max(0, Math.floor((Math.min(awRegion.y1, awRegion.y2) - bg.y) / bg.scale * s));
    rx2 = Math.min(w, Math.ceil((Math.max(awRegion.x1, awRegion.x2) - bg.x) / bg.scale * s));
    ry2 = Math.min(h, Math.ceil((Math.max(awRegion.y1, awRegion.y2) - bg.y) / bg.scale * s));

    let changed = false;
    for (let i = 0; i < n; i++) {
      const a = pts[i], b = pts[(i + 1) % n], c = pts[(i + 2) % n], d = pts[(i + 3) % n];
      const v1 = { x: b.x - a.x, y: b.y - a.y }, v3 = { x: d.x - c.x, y: d.y - c.y };
      const l1 = Math.hypot(v1.x, v1.y), l3 = Math.hypot(v3.x, v3.y);
      if (l1 > maxDepth || l3 > maxDepth || l1 < 0.5 || l3 < 0.5) continue;
      // 行って戻る(向きが逆)の短い辺の組 = でっぱり/へこみ
      if (v1.x * v3.x + v1.y * v3.y > -0.9 * l1 * l3) continue;
      if (Math.abs(v1.x) < Math.abs(v1.y)) { b.y = a.y; c.y = a.y; } else { b.x = a.x; c.x = a.x; }
      changed = true; break;
    }
    // 小さな段差(平行な2辺のずれ < 壁厚の半分くらい)をそろえる
    if (!changed) for (let i = 0; i < n; i++) {
      const a = pts[(i - 1 + n) % n], b = pts[i], c = pts[(i + 1) % n], d = pts[(i + 2) % n];
      const st = Math.hypot(c.x - b.x, c.y - b.y);
      if (st < 0.5 || st > maxDepth * 0.45) continue;
      const u1 = { x: b.x - a.x, y: b.y - a.y }, u3 = { x: d.x - c.x, y: d.y - c.y };
      const l1 = Math.hypot(u1.x, u1.y), l3 = Math.hypot(u3.x, u3.y);
      if (u1.x * u3.x + u1.y * u3.y < 0.9 * l1 * l3) continue;   // 同じ向きの2辺にはさまれた段差だけ
      const horiz = Math.abs(u1.x) > Math.abs(u1.y);
      if (l1 >= l3) { if (horiz) { c.y = b.y; d.y = b.y; } else { c.x = b.x; d.x = b.x; } }
      else { if (horiz) { a.y = c.y; b.y = c.y; } else { a.x = c.x; b.x = c.x; } }
      changed = true; break;
    }
    // 同じ点・一直線上の点を消す
    const out = [];
    pts.forEach(p => { const q = out[out.length - 1]; if (!q || Math.hypot(p.x - q.x, p.y - q.y) > 0.5) out.push(p); });
    if (out.length > 2 && Math.hypot(out[0].x - out[out.length - 1].x, out[0].y - out[out.length - 1].y) <= 0.5) out.pop();
    const before = pts.length;
    pts = out.filter((p, i) => {
      const a = out[(i - 1 + out.length) % out.length], b = out[(i + 1) % out.length];
      const l1 = Math.hypot(p.x - a.x, p.y - a.y), l2 = Math.hypot(b.x - p.x, b.y - p.y);
      return Math.abs((p.x - a.x) * (b.y - p.y) - (p.y - a.y) * (b.x - p.x)) > 0.08 * l1 * l2;   // 一直線・折り返しの点は消す
    });
    if (!changed && pts.length === before) break;
  }
  return pts;
}
// 余白を付けてから閉じる(画像の端に壁がくっついていても正しく塞げるように)
function closeBin(src, w, h, r) {
  const p = r + 2, W = w + p * 2, H = h + p * 2, pad = new Uint8Array(W * H);
  for (let y = 0; y < h; y++) pad.set(src.subarray(y * w, y * w + w), (y + p) * W + p);
  const c = erodeBin(dilateBin(pad, W, H, r), W, H, r), out = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) out.set(c.subarray((y + p) * W + p, (y + p) * W + p + w), y * w);
  return out;
}
function guessRoomName(rank, m2) {
  if (rank === 0) return 'LDK';
  if (m2 < 1.6) return '収納';
  if (m2 < 2.4) return 'トイレ';
  if (m2 < 3.6) return '洗面・浴室';
  return rank === 1 ? '洋室' : '洋室' + rank;
}

/* ───────── 3Dで歩く(vr-viewer.html を中で開く)───────── */
let viewerFrame = null;
function openWalk() {
  if (!plan.rooms.length && !plan.walls.length) { toast('先に部屋を作ってください'); return; }
  const box = $('viewer');
  box.innerHTML = '';
  viewerFrame = document.createElement('iframe');
  viewerFrame.src = 'vr-viewer.html?embed=1';
  viewerFrame.setAttribute('allow', 'xr-spatial-tracking; fullscreen');
  box.appendChild(viewerFrame);
  box.classList.add('show');
}
function closeWalk() { $('viewer').classList.remove('show'); $('viewer').innerHTML = ''; viewerFrame = null; cv.focus(); }

/* ───────── 保存・読み込み ───────── */
function generateThumbnail() {
  const b = contentBoxNoBg(); if (!b) return null;
  const W = 240, H = 180, tc = document.createElement('canvas'); tc.width = W; tc.height = H;
  const t = tc.getContext('2d'), pad = 10, s = Math.min((W - pad * 2) / Math.max(b.x2 - b.x1, 1), (H - pad * 2) / Math.max(b.y2 - b.y1, 1));
  t.fillStyle = '#fff'; t.fillRect(0, 0, W, H);
  t.translate((W - (b.x2 - b.x1) * s) / 2 - b.x1 * s, (H - (b.y2 - b.y1) * s) / 2 - b.y1 * s); t.scale(s, s);
  plan.rooms.forEach(r => { t.beginPath(); r.vertices.forEach((v, i) => i ? t.lineTo(v.x, v.y) : t.moveTo(v.x, v.y)); t.closePath(); t.fillStyle = hexA(r.color, 0.27); t.fill(); t.strokeStyle = '#1e293b'; t.lineWidth = 2 / s; t.stroke(); });
  plan.walls.forEach(w => { t.strokeStyle = '#334155'; t.lineWidth = 2 / s; t.beginPath(); t.moveTo(w.x1, w.y1); t.lineTo(w.x2, w.y2); t.stroke(); });
  plan.furnitures.forEach(f => { const c = furnCorners(f); t.beginPath(); c.forEach((p, i) => i ? t.lineTo(p.x, p.y) : t.moveTo(p.x, p.y)); t.closePath(); t.fillStyle = hexA(f.color, 0.8); t.fill(); });
  return tc.toDataURL('image/png');
}
function contentBoxNoBg() { const keep = bg; bg = null; const b = contentBox(); bg = keep; return b; }
function postToParent(msg) { try { if (embedded) window.parent.postMessage(msg, '*'); } catch (e) { /* 親がいない */ } }

$('bSave').onclick = () => {
  let thumb = null; try { thumb = generateThumbnail(); } catch (e) { console.warn(e); }
  postToParent({ type: 'vr-editor-save', data: exportData(), thumbnail: thumb });
};
$('bCancel').onclick = () => {
  if (undoStack.length && !confirm('変更を保存せずに閉じますか?')) return;
  postToParent({ type: 'vr-editor-cancel' });
};
$('bDownload').onclick = () => {
  const blob = new Blob([JSON.stringify(exportData(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = (propName || '間取り') + '.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$('bLoad').onclick = () => $('fileJson').click();
$('fileJson').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => { const d = JSON.parse(t); change(() => { plan = importData(d); }); setSelection([]); fitView(); toast('読み込みました'); }).catch(() => toast('読み込めませんでした'));
  e.target.value = '';
});

window.addEventListener('message', e => {
  const msg = e.data;
  if (!msg || typeof msg !== 'object') return;
  // 3Dビューアから
  if (viewerFrame && e.source === viewerFrame.contentWindow) {
    if (msg.type === 'vr-viewer-ready') viewerFrame.contentWindow.postMessage({ type: 'vr-viewer-init', data: exportData(), propName: propName || '確認中の間取り' }, '*');
    if (msg.type === 'vr-viewer-close') closeWalk();
    return;
  }
  // 親ページから
  if (msg.type === 'init') {
    embedded = true; showEmbedButtons();
    propName = msg.propName || '';
    propArea = +msg.area || 0;
    $('propName').textContent = propName ? '— ' + propName : '';
    plan = msg.data && typeof msg.data === 'object' ? importData(msg.data) : { rooms: [], furnitures: [], walls: [] };
    undoStack.length = 0; redoStack.length = 0; updateUndoButtons();
    setSelection([]);
    setTimeout(fitView, 30);
  }
});
function showEmbedButtons() { $('embedBtns').style.display = 'flex'; $('fileBtns').style.display = 'none'; }

/* ───────── ボタン類 ───────── */
document.querySelectorAll('.tool[data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
$('bAddRoom').onclick = openAddDialog;
$('bUndo').onclick = undo; $('bRedo').onclick = redo;
$('bZoomIn').onclick = () => zoomAt(cv.clientWidth / 2, cv.clientHeight / 2, 1.25);
$('bZoomOut').onclick = () => zoomAt(cv.clientWidth / 2, cv.clientHeight / 2, 0.8);
$('bFit').onclick = fitView;
$('bWalk').onclick = openWalk;
$('bProps').onclick = () => $('props').classList.toggle('open');
$('gridSel').onchange = e => { gridM = +e.target.value; };
$('bDims').onclick = () => { showAllDims = !showAllDims; $('bDims').textContent = showAllDims ? '寸法: すべて' : '寸法: 選択中のみ'; draw(); };
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe($('stage'));

/* ───────── 起動 ───────── */
(function boot() {
  renderFurnCats(); renderFurnList();
  if (embedded) showEmbedButtons();
  else {
    // 単体で開いたときは前回の下書きを復元
    try { const s = localStorage.getItem('vrhomes_editor_draft'); if (s) { const d = JSON.parse(s); plan = importData(exportLike(d)); } } catch (e) { /* 壊れた下書きは無視 */ }
  }
  setTool('select');
  updateUndoButtons();
  resize();
  setSelection([]);
  setTimeout(fitView, 30);
  postToParent({ type: 'vr-editor-ready' });
})();
function exportLike(d) {
  // 下書きは内部形式で保存しているので、読み込み用の形にそろえる
  return { rooms: (d.rooms || []).map(r => ({ name: r.name, color: r.color, vertices: r.vertices, openings: r.openings, groupId: r.groupId })), furnitures: d.furnitures || [], walls: d.walls || [] };
}
</script>
